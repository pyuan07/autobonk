# PokéBonk autopilot settings. Relative paths resolve against this file's folder.
# Strategy settings (card weights, icon tiers, timings) will be added here as the bot grows.

[browser]
url = "https://pokebonk.com/"
# Dedicated Chrome profile; your login persists here. Keep it out of git.
profile_dir = "profile"
viewport_width = 1600
viewport_height = 900

[frames]
# Where F9 saves frames (screenshot + DOM + metadata).
dir = "fixtures/frames"

[hotkeys]
# Global hotkeys (work while the browser is unfocused).
pause = "f8"
frame = "f9"

[bot]
# How often the bot looks at the screen and decides.
steps_per_second = 10
# Pause if the screen can't be recognised for this long.
unknown_screen_pause_s = 5

[record]
# While the bot is paused (you are playing), every popup pick you make is appended here,
# with all the cards offered, so your choices can be studied to set card weights.
choices_file = "logs/choices.jsonl"

[cards]
# How choice popups are answered: level-up, item choice, fossil ruins/blessing, Porygon, Snorlax, Ditto.
# Card names exactly as the game shows them (copy them from the log). Positive weight = prefer,
# negative = avoid, unlisted = 0. The highest weight wins; equal weights fall back to rarity, then
# the leftmost card. So any positive weight beats any unlisted card, whatever its rarity.
# Refresh (F), Skip (X) and Banish (Z) are never used.

# Best first. Anything not listed ranks below all of these. New-move cards show 招式 here;
# add it (e.g. first) if you want new moves preferred.
rarity_order = ["招式", "传说", "史诗", "稀有", "少见", "普通"]

# Tuned from the player's run recording (logs/choices.jsonl) with Mewtwo (超梦).
# Special Psychic build focusing on high-scaling special moves, spell vamp/luck/haste vitamins, and relics.
[cards.weights]
