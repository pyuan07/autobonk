# PokéBonk autopilot settings. Relative paths resolve against this file's folder.
# Strategy settings (card weights, icon tiers, timings) will be added here as the bot grows.

[browser]
url = "https://pokebonk.com/"
# Dedicated Chrome profile; your login persists here. Keep it out of git.
profile_dir = "profile"
viewport_width = 1600
viewport_height = 900

[frames]
# Where F9 saves frames (screenshot + DOM + metadata).
dir = "fixtures/frames"

[hotkeys]
# Global hotkeys (work while the browser is unfocused).
pause = "f8"
frame = "f9"
