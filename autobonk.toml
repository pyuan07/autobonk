# PokéBonk autopilot settings. Relative paths resolve against this file's folder.
# Strategy settings (card weights, icon tiers, timings) will be added here as the bot grows.

[browser]
url = "https://pokebonk.com/"
# Dedicated Chrome profile; your login persists here. Keep it out of git.
profile_dir = "profile"
viewport_width = 1600
viewport_height = 900

[frames]
# Where F9 saves frames (screenshot + DOM + metadata).
dir = "fixtures/frames"

[hotkeys]
# Global hotkeys (work while the browser is unfocused).
pause = "f8"
frame = "f9"

[bot]
# How often the bot looks at the screen and decides.
steps_per_second = 10
# Pause if the screen can't be recognised for this long.
unknown_screen_pause_s = 5
# During play, jump (Space) after a random wait in this range, in seconds.
jump_interval_s = [0.8, 1.4]
# Stand in a rune altar's ring at most this long while it charges, then move on.
altar_charge_cap_s = 45
# Walking with no progress toward the target for this long counts as stuck:
# step left (next time right) for sidestep_s, then walk on.
stuck_s = 2.5
sidestep_s = 0.6

[record]
# While the bot is paused (you are playing), every popup pick you make is appended here,
# with all the cards offered, so your choices can be studied to set card weights.
choices_file = "logs/choices.jsonl"

[cards]
active_pokemon = "超梦"
# How choice popups are answered: level-up, item choice, fossil ruins/blessing, Porygon, Snorlax, Ditto.
# Card names exactly as the game shows them. Positive weight = prefer, negative = avoid, unlisted = 0.
# The highest weight wins; equal weights fall back to rarity_order, then leftmost card.
# Stat blessings: "+伤害" weighs every "+N% 伤害" roll, whatever the number.
rarity_order = ["传说", "史诗", "招式", "稀有", "少见", "普通"]

