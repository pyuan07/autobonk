<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PokéBonk 地图目标</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/ui.css">
  <style>
    main { max-width: 1180px; margin: 0 auto; padding: 22px 20px 48px; display: flex; flex-direction: column; gap: 22px; }
    .overview { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; padding: 18px 20px; align-items: start; }
    .overview h1 { font-size: 18px; font-weight: 700; }
    .overview p { color: var(--muted); font-size: 13px; margin-top: 4px; max-width: 70ch; }
    .rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-top: 14px; }
    .rule { display: flex; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); font-size: 12.5px; color: var(--muted); }
    .rule b { color: var(--ink); font-weight: 600; display: block; font-size: 13px; margin-bottom: 1px; }
    .rule .ico { font-size: 18px; line-height: 1.2; }
    .stats { display: flex; gap: 8px; }
    .stat { padding: 10px 14px; border-radius: 10px; background: var(--surface-2); min-width: 96px; }
    .stat b { display: block; font: 700 22px/1.1 var(--num); }
    .stat span { font-size: 11.5px; color: var(--muted); }
    .stat.cost b { color: var(--warn); }
    .path { font-size: 11.5px; color: var(--faint); margin-top: 12px; word-break: break-all; }

    .boss { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 22px; padding: 18px 20px; align-items: center; }
    .boss-img { width: 72px; height: 72px; border-radius: 50%; border: 3px solid var(--danger); background: #fff; image-rendering: pixelated; box-shadow: 0 0 0 6px var(--danger-soft); }
    .boss-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .boss-head h2 { font-size: 15px; }
    .zones { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .zone { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
    .zone-title { font-size: 12px; font-weight: 600; color: var(--muted); }
    .zone label { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--muted); }
    .zone .or { font-size: 11px; color: var(--faint); text-align: center; margin: -4px 0; }
    .boss .hint { margin-top: 10px; }

    .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; position: sticky; top: var(--topbar-h); z-index: 10; padding: 10px 0; margin: -10px 0; background: linear-gradient(var(--bg) 70%, transparent); }
    .toolbar .input { flex: 1; min-width: 200px; }
    .seg { display: inline-flex; padding: 3px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
    .seg button { border: none; background: none; padding: 5px 12px; border-radius: 7px; font-size: 13px; color: var(--muted); }
    .seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--ink); }
    .seg .n { font: 12px var(--num); color: var(--faint); margin-left: 5px; }

    .group { display: flex; flex-direction: column; gap: 10px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 10px; }
    .icon { padding: 12px; display: flex; flex-direction: column; gap: 10px; transition: border-color .15s, opacity .15s; }
    .icon:hover { border-color: var(--line-strong); }
    .icon-head { display: flex; align-items: center; gap: 10px; }
    .icon img { width: 44px; height: 44px; border-radius: 50%; image-rendering: pixelated; border: 2px solid var(--w-zero); background: #fff; flex-shrink: 0; }
    .icon.on img { border-color: var(--w-pos); }
    .icon.high img { border-color: var(--w-high); }
    .icon .name { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .icon.off { opacity: .6; }
    .icon.off:hover, .icon.off:focus-within { opacity: 1; }

    .switch { position: relative; width: 34px; height: 20px; flex-shrink: 0; }
    .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
    .switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--surface-3); transition: background .15s; pointer-events: none; }
    .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }
    .switch input:checked + span { background: var(--ok); }
    .switch input:checked + span::after { transform: translateX(14px); background: #fff; }
    .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

    .ends { display: grid; grid-template-columns: auto 1fr auto; gap: 6px; align-items: center; }
    .ends .lab { font-size: 11px; color: var(--faint); text-align: center; }
    .ends .stepper button { width: 24px; height: 28px; }
    .ends .stepper input { width: 34px; height: 28px; font-size: 14px; }
    .ramp { height: 28px; width: 100%; }
    .ramp line { stroke-width: 2.5; stroke-linecap: round; }
    .empty { padding: 40px; text-align: center; color: var(--faint); }

    @media (max-width: 860px) {
      .overview { grid-template-columns: 1fr; }
      .boss { grid-template-columns: 1fr; justify-items: start; }
      .zones { grid-template-columns: 1fr; width: 100%; }
    }
    @media (max-width: 480px) {
      main { padding: 14px 12px 40px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="topbar" data-page="targets">
    <div class="save-group">
      <span class="sync" id="syncState">已同步</span>
      <button class="btn btn-primary btn-save" id="saveBtn">保存 <kbd>Ctrl S</kbd></button>
    </div>
  </header>
  <script src="/static/ui.js"></script>

  <main>
    <section class="card overview">
      <div>
        <h1>地图目标</h1>
        <p>机器人在小地图上寻找这些图标（找不到时按住 Tab 看大地图），按权重决定先去哪里。</p>
        <div class="rules">
          <div class="rule"><span class="ico">⬆️</span><div><b>权重高的先去</b>同权重先去近的，0 = 不去</div></div>
          <div class="rule"><span class="ico">📈</span><div><b>开始 → 结束</b>权重随倒计时从开始值渐变到结束值</div></div>
          <div class="rule"><span class="ico">⌨️</span><div><b>到达后按 E</b>没反应（如钱不够）就暂时跳过这类目标</div></div>
          <div class="rule"><span class="ico">⛩️</span><div><b>祭坛</b>站在圈里等充能，头目追击时不去</div></div>
        </div>
        <div class="path" id="configPath"></div>
      </div>
      <div class="stats">
        <div class="stat"><b id="sumOn">0</b><span>启用目标</span></div>
        <div class="stat cost" title="每种图标每步约多花 15 毫秒识别"><b id="sumCost">0</b><span>识别耗时 ms/步</span></div>
      </div>
    </section>

    <section class="card boss" aria-labelledby="bossTitle">
      <img class="boss-img" id="bossImg" alt="">
      <div>
        <div class="boss-head">
          <h2 id="bossTitle">区域头目</h2>
          <span class="hint">满足任一条件就去骷髅按 E 召唤，此时头目优先于一切目标</span>
        </div>
        <div class="zones" id="zones"></div>
        <p class="hint">剩余分钟可以是负数：-3 表示超时 +03:00 后才召唤。打赢后（"头目…倒下了！"）不再召唤。</p>
      </div>
    </section>

    <div class="toolbar">
      <input class="input" type="search" id="search" placeholder="搜索目标名称（按 / 聚焦）" aria-label="搜索目标">
      <span class="seg" id="filters" role="group" aria-label="显示">
        <button type="button" data-filter="all" aria-pressed="true">全部<span class="n" id="nAll"></span></button>
        <button type="button" data-filter="on" aria-pressed="false">已启用<span class="n" id="nOn"></span></button>
        <button type="button" data-filter="off" aria-pressed="false">未启用<span class="n" id="nOff"></span></button>
      </span>
    </div>

    <div id="groups"></div>
  </main>

  <script>
    const { $, esc, toast, syncState } = window.Bonk;
    const COST_MS = 15;
    const DEFAULT_ON = 5;

    let groups = [];
    let boss = null;
    let dirty = false;
    let filter = 'all';
    const remembered = {};   // last non-zero weights, restored when a target is switched back on

    async function init() {
      try {
        const res = await fetch('/api/targets');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        groups = data.groups;
        boss = data.boss;
        $('configPath').textContent = data.config_path;
        renderBoss();
        render();
      } catch (err) {
        $('groups').innerHTML = `<div class="card empty">读取失败（${esc(err.message)}），确认机器人或编辑器仍在运行后刷新页面。</div>`;
      }
    }

    const icons = () => groups.flatMap((g) => g.icons);
    const peak = (icon) => Math.max(icon.start, icon.end);
    const cls = (icon) => peak(icon) >= 8 ? 'on high' : peak(icon) > 0 ? 'on' : 'off';
    const tier = (w) => w >= 8 ? 'w-high' : w > 0 ? 'w-pos' : 'w-zero';

    // Start→end weight as a tiny line chart (0..10 maps bottom..top).
    function ramp(icon) {
      const y = (w) => 24 - (Math.min(10, w) / 10) * 20;
      return `<svg class="ramp" viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true">
        <line x1="6" y1="${y(icon.start)}" x2="94" y2="${y(icon.end)}" stroke="var(--${tier(peak(icon))})" opacity="${peak(icon) ? 1 : .35}"/>
      </svg>`;
    }

    function stepper(icon, end) {
      const label = `${esc(icon.name)} ${end === 'start' ? '开始' : '结束'}权重`;
      return `<span class="stepper ${tier(icon[end])}">
        <button type="button" data-end="${end}" data-step="-1" aria-label="${label}减 1">−</button>
        <input type="number" step="1" min="0" data-end="${end}" value="${icon[end]}" aria-label="${label}">
        <button type="button" data-end="${end}" data-step="1" aria-label="${label}加 1">+</button>
      </span>`;
    }

    function cardInner(icon) {
      return `
        <div class="icon-head">
          <img src="/icons/${encodeURIComponent(icon.name)}" alt="" loading="lazy">
          <span class="name" title="${esc(icon.name)}">${esc(icon.name)}</span>
          <label class="switch" title="${peak(icon) ? '关闭' : '启用'}">
            <input type="checkbox" data-toggle ${peak(icon) ? 'checked' : ''} aria-label="启用 ${esc(icon.name)}"><span></span>
          </label>
        </div>
        <div class="ends">
          <span class="lab">开始</span><span></span><span class="lab">结束</span>
          ${stepper(icon, 'start')}${ramp(icon)}${stepper(icon, 'end')}
        </div>`;
    }

    function matches(icon) {
      const q = $('search').value.trim();
      if (q && !icon.name.includes(q)) return false;
      if (filter === 'on') return peak(icon) > 0;
      if (filter === 'off') return peak(icon) === 0;
      return true;
    }

    function render() {
      const html = groups.map((g, gi) => {
        const shown = g.icons.map((icon, ii) => [icon, ii]).filter(([icon]) => matches(icon));
        if (!shown.length) return '';
        const on = g.icons.filter((i) => peak(i) > 0).length;
        return `
          <section class="group" style="margin-bottom:22px">
            <h2 class="section-title">${esc(g.title)} <span class="count">${on} / ${g.icons.length} 启用</span></h2>
            <div class="grid">${shown.map(([icon, ii]) =>
              `<div class="card icon ${cls(icon)}" data-g="${gi}" data-i="${ii}">${cardInner(icon)}</div>`).join('')}
            </div>
          </section>`;
      }).join('');
      $('groups').innerHTML = html || '<div class="card empty">没有符合条件的目标</div>';
      summary();
    }

    function renderBoss() {
      $('bossImg').src = '/icons/' + encodeURIComponent(boss.name);
      $('zones').innerHTML = [0, 1, 2].map((z) => `
        <div class="zone">
          <span class="zone-title">区域 ${z + 1}</span>
          <label>等级 ≥ ${bossStepper('levels', z, 1, `区域 ${z + 1} 召唤头目的等级`)}</label>
          <span class="or">或</span>
          <label>剩余 ≤ 分钟 ${bossStepper('minutes_left', z, 0.5, `区域 ${z + 1} 剩余多少分钟就召唤头目`)}</label>
        </div>`).join('');
    }

    function bossStepper(key, z, step, label) {
      return `<span class="stepper">
        <button type="button" data-boss="${key}" data-z="${z}" data-step="${-step}" aria-label="${label}减少">−</button>
        <input type="number" step="${step}" ${key === 'levels' ? 'min="1"' : ''} data-boss="${key}" data-z="${z}" value="${boss[key][z]}" aria-label="${label}" style="width:52px">
        <button type="button" data-boss="${key}" data-z="${z}" data-step="${step}" aria-label="${label}增加">+</button>
      </span>`;
    }

    function setBoss(key, z, raw) {
      const isNum = Number.isFinite(raw);
      const value = key === 'levels' ? Math.max(1, isNum ? Math.round(raw) : 1) : (isNum ? raw : 0);
      boss[key][z] = value;
      document.querySelector(`input[data-boss="${key}"][data-z="${z}"]`).value = value;
      markDirty(true);
    }

    $('zones').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-boss]');
      if (b) setBoss(b.dataset.boss, +b.dataset.z, Number(boss[b.dataset.boss][b.dataset.z]) + Number(b.dataset.step));
    });
    $('zones').addEventListener('change', (e) => {
      const i = e.target.closest('input[data-boss]');
      if (i) setBoss(i.dataset.boss, +i.dataset.z, Number(i.value));
    });

    function summary() {
      const all = icons();
      const on = all.filter((i) => peak(i) > 0).length;
      $('sumOn').textContent = on;
      $('sumCost').textContent = '~' + on * COST_MS;
      $('nAll').textContent = all.length;
      $('nOn').textContent = on;
      $('nOff').textContent = all.length - on;
    }

    // Redraw one card in place so it doesn't vanish from a filtered view mid-edit.
    function refreshCard(card, focusSel) {
      const icon = groups[card.dataset.g].icons[card.dataset.i];
      card.className = 'card icon ' + cls(icon);
      card.innerHTML = cardInner(icon);
      if (focusSel) card.querySelector(focusSel)?.focus();
      summary();
    }

    function setWeight(card, end, value, focusSel) {
      const icon = groups[card.dataset.g].icons[card.dataset.i];
      icon[end] = Math.max(0, Number.isFinite(value) ? Math.round(value) : 0);
      if (peak(icon)) remembered[icon.name] = { start: icon.start, end: icon.end };
      refreshCard(card, focusSel);
      markDirty(true);
    }

    $('groups').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-step]');
      if (!btn) return;
      const card = btn.closest('.icon');
      const end = btn.dataset.end;
      const icon = groups[card.dataset.g].icons[card.dataset.i];
      setWeight(card, end, icon[end] + Number(btn.dataset.step), `button[data-end="${end}"][data-step="${btn.dataset.step}"]`);
    });
    $('groups').addEventListener('change', (e) => {
      const card = e.target.closest('.icon');
      if (!card) return;
      if (e.target.matches('input[data-end]')) return setWeight(card, e.target.dataset.end, Number(e.target.value));
      if (e.target.matches('input[data-toggle]')) {
        const icon = groups[card.dataset.g].icons[card.dataset.i];
        if (e.target.checked) {
          const prev = remembered[icon.name] || { start: DEFAULT_ON, end: DEFAULT_ON };
          icon.start = prev.start; icon.end = prev.end;
        } else {
          remembered[icon.name] = { start: icon.start, end: icon.end };
          icon.start = 0; icon.end = 0;
        }
        refreshCard(card, 'input[data-toggle]');
        markDirty(true);
      }
    });

    $('filters').addEventListener('click', (e) => {
      const b = e.target.closest('[data-filter]');
      if (!b) return;
      filter = b.dataset.filter;
      $('filters').querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b));
      render();
    });
    let searchTimer;
    $('search').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(render, 80); });

    function markDirty(on) {
      dirty = on;
      syncState(on);
    }

    async function save() {
      const btn = $('saveBtn');
      if (btn.disabled || !groups.length) return;
      const weights = {};
      for (const icon of icons()) {
        if (peak(icon) > 0) weights[icon.name] = icon.start === icon.end ? icon.start : [icon.start, icon.end];
      }
      btn.disabled = true;
      try {
        const res = await fetch('/api/targets', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ weights, boss: { levels: boss.levels, minutes_left: boss.minutes_left } }),
        });
        const data = await res.json().catch(() => ({}));
        if (data.status !== 'ok') throw new Error(data.error || 'HTTP ' + res.status);
        markDirty(false);
        toast('已保存，重启机器人后生效。');
      } catch (err) {
        toast('保存失败：' + err.message + '。修改仍在页面上，可以再试一次。', true);
      } finally {
        btn.disabled = false;
      }
    }

    $('saveBtn').addEventListener('click', save);
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
      else if (e.key === '/' && !e.target.closest('input, select, textarea')) { e.preventDefault(); $('search').focus(); }
    });
    window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
    init();
  </script>
</body>
</html>
