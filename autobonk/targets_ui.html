<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PokéBonk 地图目标</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --bg: #1b1e2e;
      --panel: #232739;
      --panel-2: #2b3046;
      --line: #353b55;
      --ink: #e9ecf5;
      --muted: #9097b0;
      --faint: #6a7190;
      --accent: #6f93ff;
      --w-high: #f2c14e;
      --w-pos: #3cc5a8;
      --w-zero: #6a7190;
      --w-neg: #ef5b5b;
      --num: "Bahnschrift", "DIN Alternate", "Segoe UI", sans-serif;
      --sans: "Microsoft YaHei UI", "PingFang SC", "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { color-scheme: dark; }
    body { font: 14px/1.5 var(--sans); background: var(--bg); color: var(--ink); min-height: 100vh; }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .nav-links { display: flex; align-items: center; gap: 6px; }
    .nav-item { padding: 6px 12px; border-radius: 8px; font-size: 13px; color: var(--muted); text-decoration: none; border: 1px solid transparent; }
    .nav-item:hover { color: var(--ink); background: var(--panel-2); }
    .nav-item.active { color: var(--ink); background: var(--panel); border-color: var(--line); }

    .topbar {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; gap: 16px; padding: 10px 20px;
      background: rgba(27, 30, 46, 0.92); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .topbar h1 { font: 600 17px/1.2 var(--num); white-space: nowrap; }
    .topbar .path { color: var(--faint); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .spacer { flex: 1; }
    .sync { font-size: 13px; color: var(--muted); white-space: nowrap; }
    .sync.dirty { color: var(--w-high); }
    .btn { border: 1px solid var(--line); background: var(--panel-2); padding: 6px 14px; border-radius: 8px; font-size: 13px; text-decoration: none; white-space: nowrap; }
    .btn:hover { border-color: var(--faint); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #0d1430; font-weight: 600; }
    .btn-primary.dirty { background: var(--w-high); border-color: var(--w-high); color: #2a1f00; }
    kbd { font: 11px var(--num); opacity: 0.7; margin-left: 6px; }

    main { max-width: 1100px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
    .intro { color: var(--muted); font-size: 13px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
    .intro b { color: var(--ink); }
    h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 10px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }

    .icon {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      padding: 12px 10px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line);
    }
    .icon img { width: 56px; height: 56px; image-rendering: pixelated; border-radius: 50%; border: 3px solid var(--w-zero); background: #fff; }
    .icon .name { font-weight: 600; }
    .icon.off { opacity: 0.55; }
    .icon.off:hover, .icon.off:focus-within { opacity: 1; }
    .icon.on img { border-color: var(--w-pos); }
    .icon.high img { border-color: var(--w-high); }
    .ends { display: flex; flex-direction: column; gap: 4px; }
    .ends label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
    .ends label > span:first-child { width: 24px; }
    .boss { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
    .boss img { width: 64px; height: 64px; image-rendering: pixelated; border-radius: 50%; border: 3px solid var(--w-neg); background: #fff; }
    .boss table { border-collapse: collapse; }
    .boss th, .boss td { padding: 4px 10px; text-align: center; font-size: 13px; }
    .boss th { color: var(--muted); font-weight: 600; }
    .boss .note { flex: 1; min-width: 220px; color: var(--muted); font-size: 12px; }
    .stepper { display: flex; align-items: center; gap: 4px; }
    .stepper button { width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel-2); }
    .stepper button:hover { border-color: var(--faint); }
    .stepper input {
      width: 52px; height: 28px; text-align: center; border-radius: 6px; border: 1px solid var(--line);
      background: var(--bg); font: 600 15px var(--num); font-variant-numeric: tabular-nums;
    }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--line); padding: 8px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
    .toast.show { opacity: 1; }
    .toast.error { border-color: var(--w-neg); color: var(--w-neg); }

    @media (max-width: 640px) {
      .topbar { flex-wrap: wrap; gap: 8px; padding: 10px 16px; }
      .topbar .path { display: none; }
      main { padding: 16px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
      <h1>PokéBonk 地图目标</h1>
      <nav class="nav-links">
        <a href="/" class="nav-item">📊 运行仪表盘</a>
        <a href="/cards" class="nav-item">🎴 卡牌权重配置</a>
        <a href="/targets" class="nav-item active">🎯 地图目标设置</a>
      </nav>
    </div>
    <span class="path" id="configPath"></span>
    <span class="spacer"></span>
    <span class="sync" id="syncState">已同步</span>
    <button class="btn btn-primary" id="saveBtn">保存<kbd>Ctrl S</kbd></button>
  </header>

  <main>
    <p class="intro">
      机器人在小地图（找不到时按住 Tab 看大地图）上寻找这些图标。<b>权重高的先去，同权重先去近的；0 = 不去。</b>
      <b>开始 → 结束</b>：区域刚开始时用开始权重，随着倒计时减少慢慢变成结束权重（比如精灵球 0 → 6：一开始没钱不去，后面才去）。两个一样就是固定权重。
      到了祭坛会站在圈里等充能；到了其他目标按 <b>E</b>，按了没反应（比如钱不够）就先跳过这类目标一段时间。
      每多选一种图标，每一步约多花 15 毫秒识别，只选需要的。
      <span id="summary"></span>
    </p>
    <section>
      <h2>区域头目</h2>
      <div class="boss" id="boss"></div>
    </section>
    <div id="groups"></div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    let groups = [];
    let boss = null;
    let dirty = false;

    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    async function init() {
      try {
        const res = await fetch('/api/targets');
        const data = await res.json();
        groups = data.groups;
        boss = data.boss;
        document.getElementById('configPath').textContent = data.config_path;
        render();
        renderBoss();
      } catch (err) {
        toast('读取失败：' + err, true);
      }
    }

    function render() {
      document.getElementById('groups').innerHTML = groups.map((g, gi) => `
        <section style="margin-bottom:20px">
          <h2>${esc(g.title)}</h2>
          <div class="grid">${g.icons.map((icon, ii) => `
            <div class="icon ${cls(icon)}" data-g="${gi}" data-i="${ii}">
              <img src="/icons/${encodeURIComponent(icon.name)}" alt="">
              <span class="name">${esc(icon.name)}</span>
              <div class="ends">${['start', 'end'].map((end) => `
                <label><span>${end === 'start' ? '开始' : '结束'}</span>
                  <span class="stepper">
                    <button type="button" data-end="${end}" data-step="-1" aria-label="${esc(icon.name)} ${end === 'start' ? '开始' : '结束'}权重减 1">−</button>
                    <input type="number" step="1" min="0" data-end="${end}" value="${icon[end]}" aria-label="${esc(icon.name)} ${end === 'start' ? '开始' : '结束'}权重">
                    <button type="button" data-end="${end}" data-step="1" aria-label="${esc(icon.name)} ${end === 'start' ? '开始' : '结束'}权重加 1">+</button>
                  </span>
                </label>`).join('')}
              </div>
            </div>`).join('')}
          </div>
        </section>`).join('');
      summary();
    }

    function renderBoss() {
      const zones = [0, 1, 2];
      document.getElementById('boss').innerHTML = `
        <img src="/icons/${encodeURIComponent(boss.name)}" alt="">
        <table>
          <tr><th></th>${zones.map((z) => `<th>区域 ${z + 1}</th>`).join('')}</tr>
          <tr><th>等级 ≥</th>${zones.map((z) => `<td><span class="stepper"><input type="number" min="1" step="1" data-boss="levels" data-z="${z}" value="${boss.levels[z]}" aria-label="区域 ${z + 1} 打头目的等级"></span></td>`).join('')}</tr>
          <tr><th>或剩余 ≤ 分钟</th>${zones.map((z) => `<td><span class="stepper"><input type="number" step="0.5" data-boss="minutes_left" data-z="${z}" value="${boss.minutes_left[z]}" aria-label="区域 ${z + 1} 剩余多少分钟就去打头目"></span></td>`).join('')}</tr>
        </table>
        <p class="note">等级够了，或者剩余时间不多了，机器人就会去骷髅按 E 召唤头目，这时头目优先于一切目标。剩余分钟支持负数（如 -3 表示超时 +03:00 后才召唤）。头目追着你时不去祭坛（祭坛要站着不动），其他目标照去。打赢后（“头目…倒下了！”）不再召唤。</p>`;
    }

    document.getElementById('boss').addEventListener('change', (e) => {
      const input = e.target.closest('input[data-boss]');
      if (!input) return;
      const raw = Number(input.value);
      const isNum = Number.isFinite(raw);
      const value = input.dataset.boss === 'levels'
        ? Math.max(1, isNum ? raw : 1)
        : (isNum ? raw : 0);
      boss[input.dataset.boss][input.dataset.z] = value;
      input.value = value;
      markDirty(true);
    });

    function cls(icon) { const w = Math.max(icon.start, icon.end); return w >= 8 ? 'on high' : w > 0 ? 'on' : 'off'; }

    function summary() {
      const on = groups.flatMap((g) => g.icons).filter((i) => Math.max(i.start, i.end) > 0).length;
      document.getElementById('summary').textContent = `当前会去 ${on} 种目标。`;
    }

    function setWeight(card, end, value) {
      const icon = groups[card.dataset.g].icons[card.dataset.i];
      icon[end] = Math.max(0, Number.isFinite(value) ? value : 0);
      card.className = 'icon ' + cls(icon);
      card.querySelector(`input[data-end="${end}"]`).value = icon[end];
      summary();
      markDirty(true);
    }

    document.getElementById('groups').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-step]');
      if (!btn) return;
      const card = btn.closest('.icon');
      const end = btn.dataset.end;
      setWeight(card, end, Number(card.querySelector(`input[data-end="${end}"]`).value) + Number(btn.dataset.step));
    });
    document.getElementById('groups').addEventListener('change', (e) => {
      if (e.target.matches('input[data-end]')) setWeight(e.target.closest('.icon'), e.target.dataset.end, Number(e.target.value));
    });

    function markDirty(on) {
      dirty = on;
      const state = document.getElementById('syncState');
      state.textContent = on ? '未保存' : '已同步';
      state.classList.toggle('dirty', on);
      document.getElementById('saveBtn').classList.toggle('dirty', on);
    }

    async function save() {
      const weights = {};
      for (const icon of groups.flatMap((g) => g.icons)) {
        if (Math.max(icon.start, icon.end) > 0) weights[icon.name] = icon.start === icon.end ? icon.start : [icon.start, icon.end];
      }
      try {
        const res = await fetch('/api/targets', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ weights, boss: { levels: boss.levels, minutes_left: boss.minutes_left } }),
        });
        const data = await res.json();
        if (data.status !== 'ok') throw new Error(data.error);
        markDirty(false);
        toast('已保存。重新启动机器人后生效。');
      } catch (err) {
        toast('保存失败：' + err.message, true);
      }
    }

    function toast(msg, isError = false) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show' + (isError ? ' error' : '');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => (t.className = 'toast'), 2600);
    }

    document.getElementById('saveBtn').addEventListener('click', save);
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
    });
    window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
    init();
  </script>
</body>
</html>
