<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PokéBonk 运行仪表盘</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/ui.css">
  <style>
    main { max-width: 1320px; margin: 0 auto; padding: 22px 20px 40px; display: flex; flex-direction: column; gap: 16px; }

    /* Offline: keep the layout, grey out the values so stale data never looks live. */
    main.stale .live { opacity: .4; filter: saturate(.3); }

    /* ---------- Hero ---------- */
    .hero { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 28px; align-items: center; padding: 20px 24px; position: relative; overflow: hidden; }
    .hero::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--faint); transition: background .3s; }
    .hero.is-running::after { background: var(--ok); }
    .hero.is-paused::after { background: var(--warn); }
    .hero-state { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 700; }
    .hero-state .dot { width: 12px; height: 12px; }
    .hero-desc { margin-top: 4px; color: var(--muted); font-size: 13px; min-height: 20px; }
    .session { display: flex; gap: 6px; }
    .session div { min-width: 72px; padding: 8px 12px; border-radius: 10px; background: var(--surface-2); text-align: center; }
    .session b { display: block; font: 700 20px/1.1 var(--num); font-variant-numeric: tabular-nums; }
    .session span { font-size: 11.5px; color: var(--muted); }
    .session .win b { color: var(--ok); }
    .session .loss b { color: var(--danger); }
    .btn-hero { padding: 12px 26px; font-size: 15px; font-weight: 700; border-radius: 12px; border: none; min-width: 168px; }
    .btn-hero svg { width: 16px; height: 16px; }
    .btn-hero.start { background: var(--ok); color: #062219; box-shadow: 0 6px 20px rgba(52, 209, 166, .28); }
    .btn-hero.pause { background: var(--warn); color: #2a1f00; box-shadow: 0 6px 20px rgba(245, 196, 81, .28); }
    .btn-hero:hover:not(:disabled) { filter: brightness(1.08); }
    .btn-hero:disabled { background: var(--surface-3); color: var(--faint); box-shadow: none; }

    /* ---------- Run strip ---------- */
    .strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .tile { padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .tile-label { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .tile-val { font: 700 26px/1.1 var(--num); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tile-val small { font-size: 14px; color: var(--muted); font-weight: 600; margin-left: 4px; }
    .tile-val.warn { color: var(--warn); }
    .tile-val.danger { color: var(--danger); }
    .segbar { display: flex; gap: 4px; }
    .segbar i { flex: 1; height: 4px; border-radius: 4px; background: var(--surface-3); }
    .segbar i.on { background: var(--accent); }
    .segbar i.cur { background: linear-gradient(90deg, var(--accent), var(--ok)); }
    .phases { display: flex; gap: 4px; }
    .phases i { flex: 1; height: 4px; border-radius: 4px; background: var(--surface-3); }
    .phases i.on { background: var(--danger); }
    .phases i.done { background: var(--ok); }

    /* ---------- Body grid ---------- */
    .body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 16px; align-items: start; }
    .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

    .target { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
    .target-head { display: flex; justify-content: space-between; align-items: center; }
    .target-body { display: flex; align-items: center; gap: 14px; }
    .avatar {
      width: 56px; height: 56px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; font-size: 26px;
      background: var(--surface-2); border: 2px solid var(--line-strong); overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; background: #fff; }
    .target.main .avatar.has-img { border-color: var(--accent); }
    .target.sub .avatar.has-img { border-color: var(--ok); }
    .target-info { flex: 1; min-width: 0; }
    .target-name { font-size: 19px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .target-meta { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
    .target-meta b { font-family: var(--num); color: var(--ink); font-weight: 600; }
    .target.idle .target-name { color: var(--muted); font-weight: 600; font-size: 16px; }
    .proximity { height: 4px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
    .proximity i { display: block; height: 100%; width: 0; border-radius: 4px; transition: width .6s ease; }
    .target.main .proximity i { background: linear-gradient(90deg, var(--accent), var(--purple)); }
    .target.sub .proximity i { background: linear-gradient(90deg, var(--ok), #8ef0d6); }

    .telemetry { padding: 6px 0; }
    .telemetry dl { display: grid; grid-template-columns: auto minmax(0, 1fr); }
    .telemetry dt, .telemetry dd { padding: 9px 18px; border-top: 1px solid var(--line); }
    .telemetry dt:first-of-type, .telemetry dd:first-of-type { border-top: none; }
    .telemetry dt { font-size: 13px; color: var(--muted); }
    .telemetry dd { text-align: right; font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .telemetry dd.ok { color: var(--ok); }
    .telemetry dd.warn { color: var(--warn); }
    .keys { display: inline-flex; gap: 4px; justify-content: flex-end; flex-wrap: wrap; }
    .keys kbd { opacity: 1; border-color: var(--line-strong); background: var(--surface-2); padding: 3px 7px; font-size: 12px; }

    /* ---------- Log ---------- */
    .log { display: flex; flex-direction: column; min-width: 0; }
    .log-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px 12px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    .log-head .section-title { margin-right: auto; }
    .seg { display: inline-flex; padding: 2px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
    .seg button { border: none; background: none; padding: 3px 10px; border-radius: 6px; font-size: 12px; color: var(--muted); }
    .seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--ink); }
    .log-search { width: 140px; padding: 4px 9px; font-size: 12px; }
    .log-wrap { position: relative; }
    .log-stream {
      height: 520px; overflow-y: auto; padding: 10px 0;
      font: 12px/1.65 var(--mono); color: #b3bad0; background: rgba(0,0,0,.18);
      border-radius: 0 0 var(--radius) var(--radius);
    }
    .log-line { display: flex; gap: 10px; padding: 0 18px; white-space: pre-wrap; word-break: break-all; }
    .log-line:hover { background: rgba(255,255,255,.025); }
    .log-time { color: var(--faint); flex-shrink: 0; }
    .log-line.cmd { color: #7d849a; }
    .log-line.target .tag { color: var(--accent); font-weight: 700; }
    .log-line.boss .tag { color: var(--danger); font-weight: 700; }
    .log-line .sub { color: var(--ok); font-weight: 700; }
    .log-empty { padding: 40px 18px; text-align: center; color: var(--faint); font-family: var(--sans); }
    .jump {
      position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
      box-shadow: 0 8px 20px rgba(0,0,0,.4);
    }

    @media (max-width: 1100px) {
      .body { grid-template-columns: 1fr; }
      .log-stream { height: 380px; }
    }
    @media (max-width: 860px) {
      .hero { grid-template-columns: 1fr; gap: 16px; }
      .btn-hero { width: 100%; }
      .strip { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 480px) {
      main { padding: 14px 12px 32px; }
      .session div { min-width: 0; flex: 1; }
      .tile-val { font-size: 22px; }
    }
  </style>
</head>
<body>
  <header class="topbar" data-page="dashboard"></header>
  <script src="/static/ui.js"></script>

  <main id="main" class="stale">
    <section class="card hero is-offline" id="hero">
      <div>
        <div class="hero-state"><span class="dot"></span><span id="heroState">正在连接…</span></div>
        <div class="hero-desc" id="heroDesc">正在从本地控制器读取状态</div>
      </div>
      <div class="session live" aria-label="本次运行统计">
        <div><b id="statRuns">0</b><span>局数</span></div>
        <div class="win"><b id="statWins">0</b><span>胜</span></div>
        <div class="loss"><b id="statLosses">0</b><span>负</span></div>
        <div><b id="statRate">—</b><span>胜率</span></div>
      </div>
      <button class="btn btn-hero start" id="heroBtn" disabled></button>
    </section>

    <section class="strip live" aria-label="本局进度">
      <div class="card tile">
        <span class="tile-label">区域</span>
        <span class="tile-val" id="zoneVal">—</span>
        <span class="segbar" id="zoneBar"><i></i><i></i><i></i></span>
      </div>
      <div class="card tile">
        <span class="tile-label">等级</span>
        <span class="tile-val" id="levelVal">—</span>
      </div>
      <div class="card tile">
        <span class="tile-label">剩余时间 <span class="pill danger" id="overtimePill" hidden>超时</span></span>
        <span class="tile-val" id="timeVal">--:--</span>
      </div>
      <div class="card tile">
        <span class="tile-label">区域头目 <span class="pill" id="bossPill">等待</span></span>
        <span class="tile-val" id="bossVal" style="font-size:18px; line-height:1.6">—</span>
        <span class="phases" id="bossBar"><i></i><i></i><i></i></span>
      </div>
    </section>

    <div class="body">
      <div class="col live">
        <section class="card target main" id="mainCard">
          <div class="target-head">
            <span class="section-title">主目标</span>
            <span class="pill accent" id="mainPill">巡航</span>
          </div>
          <div class="target-body">
            <div class="avatar" id="mainAvatar">🧭</div>
            <div class="target-info">
              <div class="target-name" id="mainName">—</div>
              <div class="target-meta">
                <span>距离 <b id="mainDist">—</b></span>
                <span>导航 <b id="navMode">—</b></span>
              </div>
            </div>
          </div>
          <div class="proximity" aria-hidden="true"><i id="mainProx"></i></div>
        </section>

        <section class="card target sub idle" id="subCard">
          <div class="target-head">
            <span class="section-title">顺路目标</span>
            <span class="pill" id="subPill">无</span>
          </div>
          <div class="target-body">
            <div class="avatar" id="subAvatar">✨</div>
            <div class="target-info">
              <div class="target-name" id="subName">沿途没有值得绕路的物品</div>
              <div class="target-meta" id="subMeta"><span>直奔主目标</span></div>
            </div>
          </div>
          <div class="proximity" aria-hidden="true"><i id="subProx"></i></div>
        </section>

        <section class="card telemetry">
          <dl>
            <dt>祭坛</dt><dd id="chargeVal">—</dd>
            <dt>防卡监测</dt><dd id="stuckVal">—</dd>
            <dt>当前按键</dt><dd id="keysVal">—</dd>
            <dt>决策周期</dt><dd id="stepVal">—</dd>
            <dt>控制器状态</dt><dd id="statusText" style="color:var(--muted); font-weight:500">—</dd>
          </dl>
        </section>
      </div>

      <section class="card log">
        <div class="log-head">
          <span class="section-title">实时日志 <span class="count" id="logCount"></span></span>
          <input class="input log-search" id="logSearch" type="search" placeholder="筛选…" aria-label="筛选日志">
          <span class="seg" role="group" aria-label="日志类型">
            <button type="button" data-filter="all" aria-pressed="true">全部</button>
            <button type="button" data-filter="decision" aria-pressed="false">决策</button>
            <button type="button" data-filter="cmd" aria-pressed="false">按键</button>
          </span>
          <button class="btn btn-sm btn-ghost" id="clearBtn" type="button">清屏</button>
        </div>
        <div class="log-wrap">
          <div class="log-stream" id="logStream" tabindex="0" aria-label="日志内容"><div class="log-empty">等待日志…</div></div>
          <button class="btn btn-sm jump" id="jumpBtn" type="button" hidden>↓ 跳到最新</button>
        </div>
      </section>
    </div>
  </main>

  <script>
    const { $, esc, botMode, toggleBot } = window.Bonk;

    const EMOJI = {
      '符文祭坛': '⛩️', '圣地': '🏛️', '骷髅': '💀', '区域头目': '👑', '传送门': '🌀',
      '精灵球': '🔴', '超级球': '🔵', '礼物球': '🎁', '金币': '🪙', '吉利蛋': '🥚', '探索未知': '🧭',
    };
    const NAV = { minimap: '小地图', zonemap: '大地图 (Tab)', arena_orbit: '头目场地绕圈' };
    const PROX_RANGE = 600;  // px at which the proximity bar is empty

    // Target names match /icons/<name> for anything on the targets page; fall back to an emoji.
    const avatarCache = {};
    function setAvatar(el, name, fallback) {
      if (el.dataset.name === name) return;
      el.dataset.name = name;
      const emoji = Object.entries(EMOJI).find(([k]) => name.includes(k))?.[1] || fallback;
      el.classList.remove('has-img');
      el.textContent = emoji;
      if (!name || avatarCache[name] === false) return;
      const img = new Image();
      img.alt = '';
      img.onload = () => { avatarCache[name] = true; if (el.dataset.name === name) { el.replaceChildren(img); el.classList.add('has-img'); } };
      img.onerror = () => { avatarCache[name] = false; };
      img.src = '/icons/' + encodeURIComponent(name);
    }

    const fmtDist = (d) => (d === null || d === undefined) ? null : Math.round(d);
    const prox = (d) => d === null ? 0 : Math.max(4, Math.min(100, 100 - (d / PROX_RANGE) * 100));

    // ---------- Render ----------
    function render(s) {
      const mode = botMode(s);
      $('main').classList.toggle('stale', mode === 'offline');

      // Hero
      $('hero').className = `card hero is-${mode}`;
      $('heroState').textContent = { offline: s ? '未连接到游戏' : '控制器离线', paused: '已暂停', running: '自动运行中' }[mode];
      $('heroDesc').textContent = !s ? '没有检测到 autobonk 进程，启动后此页会自动刷新'
        : mode === 'offline' ? '请先打开游戏，机器人连上后会自动显示状态'
        : (s.status_text || (mode === 'paused' ? '点击右侧按钮继续' : '正在寻路、拾取和选卡'));
      const btn = $('heroBtn');
      btn.disabled = mode === 'offline';
      btn.className = `btn btn-hero ${mode === 'running' ? 'pause' : 'start'}`;
      btn.innerHTML = mode === 'running'
        ? '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg>暂停'
        : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5Z"/></svg>' + (mode === 'paused' ? '继续运行' : '启动');

      if (!s) return;

      // Session
      const done = (s.wins || 0) + (s.losses || 0);
      $('statRuns').textContent = s.runs || 0;
      $('statWins').textContent = s.wins || 0;
      $('statLosses').textContent = s.losses || 0;
      $('statRate').textContent = done ? Math.round((s.wins / done) * 100) + '%' : '—';

      // Zone "区域 2/3"
      const zm = /(\d+)\s*\/\s*(\d+)/.exec(s.zone || '');
      $('zoneVal').innerHTML = zm ? `${zm[1]}<small>/ ${zm[2]}</small>` : esc(s.zone || '—');
      const zi = zm ? +zm[1] : 0;
      [...$('zoneBar').children].forEach((el, i) => { el.className = i + 1 < zi ? 'on' : i + 1 === zi ? 'cur' : ''; });

      $('levelVal').textContent = s.level != null ? 'Lv ' + s.level : '—';

      const cd = s.countdown || '';
      const overtime = cd.startsWith('+');
      $('timeVal').textContent = cd || '--:--';
      $('timeVal').className = 'tile-val' + (overtime ? ' danger' : (s.seconds_left != null && s.seconds_left < 60 ? ' warn' : ''));
      $('overtimePill').hidden = !overtime;

      // Boss: waiting → ready → fighting → beaten
      const phase = s.boss_phase === 'waiting' && s.boss_ready ? 'ready' : s.boss_phase;
      const B = {
        waiting: ['等待', '', '等级或时间未到', 0],
        ready: ['条件达成', 'warn', '前往骷髅召唤', 1],
        fighting: ['战斗中', 'danger', '正在攻击头目', 2],
        beaten: ['已击败', 'ok', '前往传送门', 3],
      }[phase] || [esc(phase), '', '—', 0];
      $('bossPill').className = 'pill ' + B[1];
      $('bossPill').textContent = B[0];
      $('bossVal').textContent = B[2];
      [...$('bossBar').children].forEach((el, i) => { el.className = phase === 'beaten' ? 'done' : i < B[3] ? 'on' : ''; });

      // Main target
      const main = s.main_target || s.target || '';
      const md = fmtDist(s.target_distance);
      $('mainCard').classList.toggle('idle', !main);
      $('mainName').textContent = main || '探索地图（暂无明确目标）';
      setAvatar($('mainAvatar'), main, main ? '⭐' : '🧭');
      $('mainDist').textContent = md === null ? '—' : md + ' px';
      $('navMode').textContent = NAV[s.nav_mode] || s.nav_mode || '—';
      $('mainPill').textContent = main ? '已锁定' : '巡航';
      $('mainProx').style.width = prox(md) + '%';

      // Sub target
      const sub = s.sub_target || '';
      const sd = fmtDist(s.sub_target_distance);
      $('subCard').classList.toggle('idle', !sub);
      $('subPill').className = 'pill ' + (sub ? 'ok' : '');
      $('subPill').textContent = sub ? '顺手拾取' : '无';
      $('subName').textContent = sub || '沿途没有值得绕路的物品';
      setAvatar($('subAvatar'), sub, sub ? '💎' : '✨');
      $('subMeta').innerHTML = sub
        ? `<span>距离 <b>${sd === null ? '贴身' : sd + ' px'}</b></span><span>拾取后回到主路线</span>`
        : '<span>直奔主目标</span>';
      $('subProx').style.width = sub ? prox(sd) + '%' : '0';

      // Telemetry
      const charge = $('chargeVal');
      charge.textContent = s.charging ? '圈内充能中' : '未充能';
      charge.className = s.charging ? 'ok' : '';
      const stuck = $('stuckVal');
      stuck.textContent = s.stuck_seconds > 0 ? `卡住 ${s.stuck_seconds}s，侧移脱困` : '移动正常';
      stuck.className = s.stuck_seconds > 0 ? 'warn' : 'ok';
      const keys = s.held_keys || [];
      $('keysVal').innerHTML = keys.length
        ? `<span class="keys">${keys.map((k) => `<kbd>${esc(String(k).replace(/^Key/, ''))}</kbd>`).join('')}</span>`
        : '<span style="color:var(--faint)">无</span>';
      const ms = Math.round(s.step_duration_ms || 0);
      $('stepVal').textContent = ms + ' ms';
      $('stepVal').className = ms > 800 ? 'warn' : '';
      $('statusText').textContent = s.status_text || '—';

      renderLogs(s.recent_logs || []);
    }

    // ---------- Log ----------
    let logs = [];
    let clearedAt = null;       // last line visible when 清屏 was pressed
    let filter = 'all';
    let follow = true;
    let lastKey = '';

    const isCmd = (l) => /^\[[\d:]+\]\s*->/.test(l);
    const isDecision = (l) => /\[(目标决策|Boss判定)\]/.test(l) || !isCmd(l);

    function lineHtml(raw) {
      const m = /^\[([\d:]+)\]\s*(.*)$/.exec(raw);
      const time = m ? m[1] : '';
      let text = esc(m ? m[2] : raw);
      let cls = '';
      if (isCmd(raw)) { cls = 'cmd'; text = text.replace(/^-&gt;\s*/, '→ '); }
      if (text.includes('[目标决策]')) { cls = 'target'; text = text.replace('[目标决策]', '<span class="tag">[目标决策]</span>'); }
      if (text.includes('[Boss判定]')) { cls = 'boss'; text = text.replace('[Boss判定]', '<span class="tag">[Boss判定]</span>'); }
      text = text.replace(/(顺路:\s*[^)\s]+)/, '<span class="sub">$1</span>');
      return `<div class="log-line ${cls}"><span class="log-time">${time}</span><span>${text}</span></div>`;
    }

    function visibleLogs() {
      let out = logs;
      if (clearedAt !== null) {
        const i = out.lastIndexOf(clearedAt);
        if (i >= 0) out = out.slice(i + 1);
      }
      if (filter === 'cmd') out = out.filter(isCmd);
      if (filter === 'decision') out = out.filter(isDecision);
      const q = $('logSearch').value.trim().toLowerCase();
      if (q) out = out.filter((l) => l.toLowerCase().includes(q));
      return out;
    }

    function renderLogs(next, force = false) {
      logs = next;
      const shown = visibleLogs();
      const key = filter + '|' + $('logSearch').value + '|' + clearedAt + '|' + shown.length + '|' + (shown.at(-1) || '');
      if (!force && key === lastKey) return;
      lastKey = key;
      const stream = $('logStream');
      stream.innerHTML = shown.length
        ? shown.map(lineHtml).join('')
        : `<div class="log-empty">${logs.length ? '没有符合筛选条件的日志' : '等待日志…'}</div>`;
      $('logCount').textContent = shown.length ? shown.length + ' 条' : '';
      if (follow) stream.scrollTop = stream.scrollHeight;
    }

    // Following stops when you scroll up to read, and resumes at the bottom.
    $('logStream').addEventListener('scroll', () => {
      const el = $('logStream');
      follow = el.scrollHeight - el.scrollTop - el.clientHeight < 24;
      $('jumpBtn').hidden = follow;
    });
    $('jumpBtn').addEventListener('click', () => {
      const el = $('logStream');
      el.scrollTop = el.scrollHeight;
      follow = true;
      $('jumpBtn').hidden = true;
    });
    $('clearBtn').addEventListener('click', () => {
      clearedAt = logs.at(-1) ?? null;
      renderLogs(logs, true);
    });
    document.querySelector('.seg').addEventListener('click', (e) => {
      const b = e.target.closest('[data-filter]');
      if (!b) return;
      filter = b.dataset.filter;
      document.querySelectorAll('.seg [data-filter]').forEach((x) => x.setAttribute('aria-pressed', x === b));
      renderLogs(logs, true);
    });
    $('logSearch').addEventListener('input', () => renderLogs(logs, true));

    $('heroBtn').addEventListener('click', toggleBot);
    window.Bonk.onStatus(render);
  </script>
</body>
</html>
